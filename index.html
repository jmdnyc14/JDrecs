<!DOCTYPE html>
<html>
<head>
  <title>jdlogs</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 620px;
      margin: 48px auto;
      padding: 0 24px;
      color: #1a1a1a;
      background: #f9f9f7;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #444;
    }

    textarea {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-family: sans-serif;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      box-sizing: border-box;
      resize: vertical;
      line-height: 1.6;
      color: #1a1a1a;
    }

    textarea:focus { outline: none; border-color: #999; }

    .key-row {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      align-items: center;
    }

    .key-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 13px;
      font-family: monospace;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
    }

    .key-row input:focus { outline: none; border-color: #999; }

    .key-note { font-size: 12px; color: #888; margin-bottom: 16px; }
    .key-note a { color: #555; }

    button {
      background: #1a1a1a;
      color: #fff;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }

    button:hover { background: #333; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      min-height: 20px;
      text-align: center;
    }

    #results { margin-top: 24px; }

    .result-card {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .result-number {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .result-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .result-reason { font-size: 13px; color: #555; line-height: 1.6; }

    .error {
      background: #fff3f3;
      border: 1px solid #fcc;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #c00;
    }

    .form-row {
      display: flex;
      gap: 16px;
      margin: 12px 0;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .form-row > div { display: flex; flex-direction: column; gap: 5px; }

    .form-row select,
    .form-row input[type="date"] {
      padding: 10px 12px;
      font-size: 14px;
      font-family: sans-serif;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #000;
      cursor: pointer;
    }

    .form-row select:focus,
    .form-row input[type="date"]:focus { outline: none; border-color: #999; }

    /* ── Media type tags ── */
    .type-tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #000;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* ── Log section ── */
    .log-section {
      margin-top: 48px;
      border-top: 1px solid #e8e8e4;
      padding-top: 24px;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 8px;
    }

    .log-header h2 { font-size: 16px; font-weight: 600; margin: 0; }

    .log-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .log-actions button {
      width: auto;
      padding: 7px 14px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn-add    { background: #1a1a1a; color: #fff; border: 1px solid #1a1a1a; }
    .btn-add:hover { background: #333; }
    .btn-collapse-all { background: #fff; color: #444; border: 1px solid #ddd; }
    .btn-collapse-all:hover { background: #f0f0ee; }
    .btn-export { background: #fff; color: #1a1a1a; border: 1px solid #ddd; }
    .btn-export:hover { background: #f0f0ee; }
    .btn-clear  { background: #fff; color: #c00; border: 1px solid #fcc; }
    .btn-clear:hover { background: #fff3f3; }

    .log-empty { font-size: 13px; color: #aaa; text-align: center; padding: 24px 0; }

    /* Manual entry form */
    .manual-form {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .manual-form-row {
      display: flex;
      gap: 12px;
      margin: 10px 0;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .manual-form-row > div { display: flex; flex-direction: column; gap: 5px; }

    .manual-form-row select,
    .manual-form-row input[type="date"] {
      padding: 8px 10px;
      font-size: 13px;
      font-family: sans-serif;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #000;
      cursor: pointer;
    }

    .manual-form-row select:focus,
    .manual-form-row input[type="date"]:focus { outline: none; border-color: #999; }

    .manual-form-btns { display: flex; gap: 8px; margin-top: 12px; }
    .manual-form-btns button { width: auto; padding: 9px 18px; font-size: 13px; }
    .btn-form-cancel { background: #fff; color: #444; border: 1px solid #ddd; }
    .btn-form-cancel:hover { background: #f0f0ee; }

    /* Log entries */
    .log-entry {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .log-entry-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .log-entry-left { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }

    .log-entry-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-chevron {
      background: none;
      border: none;
      color: #bbb;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      width: auto;
      line-height: 1;
      flex-shrink: 0;
    }

    .btn-chevron:hover { color: #555; background: none; }

    .log-entry-logged {
      font-size: 11px;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .log-entry-record {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .log-entry-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .log-entry-rating {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      background: #f0f0ee;
      border-radius: 5px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    /* Inline text buttons (edit, remove, hide) */
    .btn-inline {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: auto;
      font-size: 11px;
      text-decoration: underline;
      font-weight: 400;
    }

    .btn-inline.muted  { color: #aaa; }
    .btn-inline.muted:hover { color: #555; background: none; }
    .btn-inline.danger { color: #ccc; }
    .btn-inline.danger:hover { color: #c00; background: none; }

    /* Inline date / type edit row */
    .inline-edit {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .inline-edit input[type="date"],
    .inline-edit select {
      padding: 3px 7px;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #000;
    }

    .inline-edit input[type="date"]:focus,
    .inline-edit select:focus { outline: none; border-color: #999; }

    .btn-isave, .btn-icancel {
      background: none;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      width: auto;
      color: #444;
      font-weight: 500;
    }

    .btn-isave { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .btn-isave:hover { background: #333; }
    .btn-icancel:hover { background: #f0f0ee; }

    /* Log entry body */
    .log-entry-body { margin-top: 12px; }

    .log-history {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      border-left: 2px solid #e8e8e4;
      padding-left: 10px;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .sugg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .sugg-label {
      font-size: 11px;
      font-weight: 700;
      color: #ccc;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .log-type-group { margin-bottom: 10px; }

    .log-type-label {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .log-item {
      font-size: 13px;
      color: #1a1a1a;
      padding: 3px 0;
      border-bottom: 1px solid #f3f3f1;
    }

    .log-item:last-child { border-bottom: none; }
    .log-item-title { font-weight: 600; }
    .log-item-reason { color: #777; font-size: 12px; }
  </style>
</head>
<body>

  <h1>jdlogs</h1>
  <p class="subtitle">Tell the agent what you've enjoyed — it'll find your next favourite.</p>

  <label for="history">Your recent watches, reads, or listens</label>
  <textarea id="history" rows="6"
    placeholder="e.g.
- Watched Inception and loved it
- Read Dune, really enjoyed the world-building
- Listened to a lot of Radiohead lately
- Watched The Bear on Hulu, loved the pacing
- Played The Last of Us, loved the story"></textarea>

  <div class="form-row">
    <div>
      <label for="media-type">Media type</label>
      <select id="media-type" onchange="updateSelectColor(this)">
        <option value="">— Select —</option>
        <option value="Film">Film</option>
        <option value="Television Series">Television Series</option>
        <option value="Game">Game</option>
        <option value="Song">Song</option>
        <option value="Album">Album</option>
        <option value="Book">Book</option>
      </select>
    </div>
    <div>
      <label for="record-date">Date of record</label>
      <input type="date" id="record-date" />
    </div>
    <div>
      <label for="rating">Enjoyment</label>
      <select id="rating">
        <option value="1">1</option><option value="2">2</option>
        <option value="3">3</option><option value="4">4</option>
        <option value="5" selected>5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option>
        <option value="9">9</option><option value="10">10</option>
      </select>
    </div>
  </div>

  <div class="key-row">
    <input type="password" id="api-key" placeholder="Paste your Anthropic API key here (sk-ant-...)" />
  </div>
  <p class="key-note">Get a free key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys. It stays in your browser only.</p>

  <button id="go-btn" onclick="getRecommendations()">Get recommendations</button>

  <p id="status"></p>
  <div id="results"></div>

  <div class="log-section">
    <div class="log-header">
      <h2>Media Log</h2>
      <div class="log-actions">
        <button class="btn-add" onclick="toggleAddForm()">+ Add</button>
        <button class="btn-collapse-all" id="collapse-all-btn" onclick="toggleAllEntries()">Collapse all</button>
        <button class="btn-export" onclick="exportCSV()">Export CSV</button>
        <button class="btn-clear" onclick="clearLog()">Clear log</button>
      </div>
    </div>

    <div class="manual-form" id="manual-form" style="display:none;">
      <label for="manual-history">What did you watch, read, or listen to?</label>
      <textarea id="manual-history" rows="4" placeholder="e.g.&#10;- Watched Parasite&#10;- Read The Road&#10;- Played Hollow Knight"></textarea>
      <div class="manual-form-row">
        <div>
          <label for="manual-type">Media type</label>
          <select id="manual-type" onchange="updateSelectColor(this)">
            <option value="">— Select —</option>
            <option value="Film">Film</option>
            <option value="Television Series">Television Series</option>
            <option value="Game">Game</option>
            <option value="Song">Song</option>
            <option value="Album">Album</option>
            <option value="Book">Book</option>
          </select>
        </div>
        <div>
          <label for="manual-date">Date of record</label>
          <input type="date" id="manual-date" />
        </div>
        <div>
          <label for="manual-rating">Enjoyment</label>
          <select id="manual-rating">
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5" selected>5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option>
            <option value="9">9</option><option value="10">10</option>
          </select>
        </div>
      </div>
      <div class="manual-form-btns">
        <button onclick="addManualEntry()">Save entry</button>
        <button class="btn-form-cancel" onclick="toggleAddForm()">Cancel</button>
      </div>
    </div>

    <div id="log"></div>
  </div>

  <script>
    const LOG_KEY = "jdrecs_log";

    const TYPE_COLORS = {
      "Film":              { bg: "#ffffff", border: "1px solid #ccc" },
      "Television Series": { bg: "#ff6b6b", border: "none" },
      "Game":              { bg: "#4fa3f7", border: "none" },
      "Song":              { bg: "#4ecb71", border: "none" },
      "Album":             { bg: "#4ecb71", border: "none" },
      "Book":              { bg: "#ff8c42", border: "none" },
    };

    const TYPE_PLURALS = {
      "Movie": "Movies", "TV Show": "TV Shows", "Book": "Books",
      "Album": "Albums", "Podcast": "Podcasts", "Video Game": "Video Games"
    };
    const TYPE_ORDER = ["Movie", "TV Show", "Book", "Album", "Podcast", "Video Game"];

    const collapsedEntries = new Set();
    const hiddenSuggestions = new Set();

    // Set defaults on load
    document.getElementById("record-date").value = new Date().toISOString().slice(0, 10);

    function updateSelectColor(el) {
      const cfg = TYPE_COLORS[el.value];
      if (cfg) {
        el.style.background = cfg.bg;
        el.style.border = cfg.border === "none" ? "1px solid transparent" : cfg.border;
        el.style.color = "#000";
      } else {
        el.style.background = "#fff";
        el.style.border = "1px solid #ddd";
        el.style.color = "#1a1a1a";
      }
    }

    function typeTagHTML(type) {
      if (!type) return '<span style="font-size:11px;color:#ccc;">No type</span>';
      const cfg = TYPE_COLORS[type] || { bg: "#eee", border: "none" };
      const border = cfg.border !== "none" ? `border:${cfg.border};` : "";
      return `<span class="type-tag" style="background:${cfg.bg};${border}">${type}</span>`;
    }

    function loadLog() {
      try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; }
      catch { return []; }
    }

    function saveToLog(history, mediaType, recordDate, rating, recs) {
      const entries = loadLog();
      entries.unshift({ date: new Date().toISOString(), mediaType, recordDate, rating, history, recommendations: recs });
      localStorage.setItem(LOG_KEY, JSON.stringify(entries));
      renderLog();
    }

    function updateEntry(index, patch) {
      const entries = loadLog();
      if (entries[index]) Object.assign(entries[index], patch);
      localStorage.setItem(LOG_KEY, JSON.stringify(entries));
      renderLog();
    }

    function removeEntry(index) {
      if (!confirm("Remove this log entry?")) return;
      const entries = loadLog();
      const removed = entries.splice(index, 1)[0];
      collapsedEntries.delete(removed.date);
      hiddenSuggestions.delete(removed.date);
      localStorage.setItem(LOG_KEY, JSON.stringify(entries));
      renderLog();
    }

    function toggleEntry(dateKey) {
      if (collapsedEntries.has(dateKey)) collapsedEntries.delete(dateKey);
      else collapsedEntries.add(dateKey);
      renderLog();
    }

    function toggleAllEntries() {
      const entries = loadLog();
      const allCollapsed = entries.length > 0 && entries.every(e => collapsedEntries.has(e.date));
      if (allCollapsed) { collapsedEntries.clear(); }
      else { entries.forEach(e => collapsedEntries.add(e.date)); }
      renderLog();
    }

    function toggleSuggestions(dateKey) {
      if (hiddenSuggestions.has(dateKey)) hiddenSuggestions.delete(dateKey);
      else hiddenSuggestions.add(dateKey);
      renderLog();
    }

    function formatDate(iso) {
      if (!iso) return "—";
      return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }

    function typeOptions(selected) {
      return ["Film","Television Series","Game","Song","Album","Book"].map(t =>
        `<option value="${t}"${t === selected ? " selected" : ""}>${t}</option>`
      ).join("");
    }

    function renderLog() {
      const entries = loadLog();
      const container = document.getElementById("log");
      const collapseBtn = document.getElementById("collapse-all-btn");

      if (entries.length === 0) {
        container.innerHTML = '<p class="log-empty">No entries yet — get some recommendations to start your log.</p>';
        if (collapseBtn) collapseBtn.style.display = "none";
        return;
      }

      if (collapseBtn) {
        collapseBtn.style.display = "";
        const allCollapsed = entries.every(e => collapsedEntries.has(e.date));
        collapseBtn.textContent = allCollapsed ? "Expand all" : "Collapse all";
      }

      container.innerHTML = entries.map((entry, index) => {
        const isCollapsed = collapsedEntries.has(entry.date);
        const isSuggHidden = hiddenSuggestions.has(entry.date);
        const recs = entry.recommendations || [];

        const loggedDate = new Date(entry.date).toLocaleDateString("en-US", {
          year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        });
        const recordDisplay = entry.recordDate ? formatDate(entry.recordDate) : "Not set";
        const chevron = isCollapsed ? "▸" : "▾";

        // Grouped recommendations
        const grouped = {};
        for (const r of recs) {
          if (!grouped[r.type]) grouped[r.type] = [];
          grouped[r.type].push(r);
        }
        const sortedTypes = Object.keys(grouped).sort(
          (a, b) => TYPE_ORDER.indexOf(a) - TYPE_ORDER.indexOf(b)
        );
        const groupsHTML = sortedTypes.map(type => `
          <div class="log-type-group">
            <div class="log-type-label">${TYPE_PLURALS[type] || type + "s"}</div>
            ${grouped[type].map(r => `
              <div class="log-item">
                <span class="log-item-title">${r.title}</span>
                <span class="log-item-reason"> — ${r.reason}</span>
              </div>`).join("")}
          </div>`).join("");

        const bodyHTML = isCollapsed ? "" : `
          <div class="log-entry-body">
            <div class="log-history">${entry.history}</div>
            ${recs.length > 0 ? `
              <div class="sugg-header">
                <span class="sugg-label">Suggestions</span>
                <button class="btn-inline muted" onclick="toggleSuggestions('${entry.date}')">
                  ${isSuggHidden ? "Show suggestions" : "Hide suggestions"}
                </button>
              </div>
              ${isSuggHidden ? "" : `<div>${groupsHTML}</div>`}
            ` : ""}
          </div>`;

        return `
          <div class="log-entry" id="entry-${index}">
            <div class="log-entry-meta">
              <div class="log-entry-left">
                <div class="log-entry-top">
                  <button class="btn-chevron" onclick="toggleEntry('${entry.date}')">${chevron}</button>
                  <span id="type-display-${index}" style="display:inline-flex;align-items:center;gap:6px;">
                    ${typeTagHTML(entry.mediaType)}
                    <button class="btn-inline muted" onclick="startEditType(${index})">Edit</button>
                  </span>
                  <span class="inline-edit" id="type-edit-${index}" style="display:none;">
                    <select id="type-select-${index}" onchange="updateSelectColor(this)" style="font-size:12px;padding:3px 7px;">
                      <option value="">— Select —</option>
                      ${typeOptions(entry.mediaType || "")}
                    </select>
                    <button class="btn-isave" onclick="saveEditType(${index})">Save</button>
                    <button class="btn-icancel" onclick="cancelEditType(${index})">Cancel</button>
                  </span>
                </div>
                ${isCollapsed ? `<span class="log-entry-logged">Logged: ${loggedDate}</span>` : `
                <span class="log-entry-logged">Logged: ${loggedDate}</span>
                <span class="log-entry-record" id="record-display-${index}">
                  Record date: ${recordDisplay}
                  <button class="btn-inline muted" onclick="startEditDate(${index}, '${entry.recordDate || ''}')">Edit</button>
                </span>
                <span class="inline-edit" id="record-edit-${index}" style="display:none;">
                  <input type="date" id="record-input-${index}" value="${entry.recordDate || new Date().toISOString().slice(0,10)}" />
                  <button class="btn-isave" onclick="saveEditDate(${index})">Save</button>
                  <button class="btn-icancel" onclick="cancelEditDate(${index})">Cancel</button>
                </span>`}
              </div>
              <div class="log-entry-right">
                <span class="log-entry-rating">Enjoyed: ${entry.rating}/10</span>
                <button class="btn-inline danger" onclick="removeEntry(${index})">Remove</button>
              </div>
            </div>
            ${bodyHTML}
          </div>`;
      }).join("");

      // Re-apply select colors for any visible type-edit selects
      entries.forEach((_, index) => {
        const sel = document.getElementById(`type-select-${index}`);
        if (sel) updateSelectColor(sel);
      });
    }

    // ── Type editing ──
    function startEditType(index) {
      document.getElementById(`type-display-${index}`).style.display = "none";
      document.getElementById(`type-edit-${index}`).style.display = "flex";
      const sel = document.getElementById(`type-select-${index}`);
      if (sel) updateSelectColor(sel);
    }

    function saveEditType(index) {
      const val = document.getElementById(`type-select-${index}`).value;
      updateEntry(index, { mediaType: val });
    }

    function cancelEditType(index) {
      document.getElementById(`type-display-${index}`).style.display = "inline-flex";
      document.getElementById(`type-edit-${index}`).style.display = "none";
    }

    // ── Date editing ──
    function startEditDate(index, currentDate) {
      document.getElementById(`record-display-${index}`).style.display = "none";
      document.getElementById(`record-edit-${index}`).style.display = "flex";
      if (currentDate) document.getElementById(`record-input-${index}`).value = currentDate;
    }

    function saveEditDate(index) {
      updateEntry(index, { recordDate: document.getElementById(`record-input-${index}`).value });
    }

    function cancelEditDate(index) {
      document.getElementById(`record-display-${index}`).style.display = "flex";
      document.getElementById(`record-edit-${index}`).style.display = "none";
    }

    // ── Manual add ──
    function toggleAddForm() {
      const form = document.getElementById("manual-form");
      const visible = form.style.display !== "none";
      form.style.display = visible ? "none" : "block";
      if (!visible) {
        document.getElementById("manual-date").value = new Date().toISOString().slice(0, 10);
        document.getElementById("manual-history").value = "";
        document.getElementById("manual-rating").value = "5";
        const sel = document.getElementById("manual-type");
        sel.value = "";
        updateSelectColor(sel);
      }
    }

    function addManualEntry() {
      const history = document.getElementById("manual-history").value.trim();
      if (!history) { alert("Please describe some media first."); return; }
      const mediaType  = document.getElementById("manual-type").value;
      const recordDate = document.getElementById("manual-date").value;
      const rating     = document.getElementById("manual-rating").value;
      const entries = loadLog();
      entries.unshift({ date: new Date().toISOString(), mediaType, recordDate, rating, history, recommendations: [], manual: true });
      localStorage.setItem(LOG_KEY, JSON.stringify(entries));
      toggleAddForm();
      renderLog();
    }

    // ── Export ──
    function exportCSV() {
      const entries = loadLog();
      if (entries.length === 0) { alert("No log entries to export."); return; }
      const rows = [["Logged Date", "Record Date", "Media Type", "Rating", "Rec Type", "Title", "Reason", "History"]];
      for (const entry of entries) {
        const logged = new Date(entry.date).toLocaleString();
        const record = entry.recordDate || "";
        const recs = entry.recommendations || [];
        if (recs.length === 0) {
          rows.push([logged, record, entry.mediaType || "", entry.rating, "", "", "", entry.history.replace(/\n/g, " ")]);
        } else {
          for (const r of recs) {
            rows.push([logged, record, entry.mediaType || "", entry.rating, r.type, r.title, r.reason, entry.history.replace(/\n/g, " ")]);
          }
        }
      }
      const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "jdlogs.csv";
      a.click();
    }

    function clearLog() {
      if (!confirm("Clear your entire media log? This cannot be undone.")) return;
      localStorage.removeItem(LOG_KEY);
      collapsedEntries.clear();
      hiddenSuggestions.clear();
      renderLog();
    }

    // ── Get recommendations ──
    async function getRecommendations() {
      const history    = document.getElementById("history").value.trim();
      const mediaType  = document.getElementById("media-type").value;
      const recordDate = document.getElementById("record-date").value;
      const rating     = document.getElementById("rating").value;
      const apiKey     = document.getElementById("api-key").value.trim();
      const btn        = document.getElementById("go-btn");
      const status     = document.getElementById("status");
      const results    = document.getElementById("results");

      if (!history) {
        status.textContent = "Please describe some things you've watched, read, or listened to.";
        return;
      }

      if (!apiKey || !apiKey.startsWith("sk-")) {
        status.textContent = "Please paste your API key above (starts with sk-ant-...).";
        return;
      }

      btn.disabled = true;
      status.textContent = "Thinking...";
      results.innerHTML = "";

      const prompt = `You are a personalized media recommendation agent.

The user has shared their recent viewing, reading, and listening history:

${history}

The user rated their overall enjoyment of this content: ${rating}/10.

Based on this, recommend exactly 5 things they haven't seen/read/heard yet.
Mix media types if it fits (movies, shows, books, albums, podcasts, video games).

Return ONLY a JSON array with exactly 5 objects. No extra text, no markdown, just raw JSON.
Each object must have:
- "title": the name of the work
- "type": one of "Movie", "TV Show", "Book", "Album", "Podcast", or "Video Game"
- "reason": one sentence explaining why they'd love it based on their history

Example format:
[{"title":"...","type":"Movie","reason":"..."},...]`;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 1000,
            messages: [{ role: "user", content: prompt }]
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || "API error " + response.status);
        }

        const data = await response.json();
        const text = data.content[0].text.trim();

        let recs;
        try {
          const clean = text.replace(/```json|```/g, "").trim();
          recs = JSON.parse(clean);
        } catch {
          throw new Error("Couldn't parse the response. Try again.");
        }

        status.textContent = "";
        results.innerHTML = recs.map((r, i) => `
          <div class="result-card">
            <div class="result-number">#${i + 1} &mdash; ${r.type}</div>
            <div class="result-title">${r.title}</div>
            <div class="result-reason">${r.reason}</div>
          </div>`).join("");

        saveToLog(history, mediaType, recordDate, rating, recs);

      } catch (err) {
        status.textContent = "";
        results.innerHTML = `<div class="error">Something went wrong: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    renderLog();
  </script>

</body>
</html>
