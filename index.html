<!DOCTYPE html>
<html>
<head>
  <title>jdlogs</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 620px;
      margin: 48px auto;
      padding: 0 24px;
      color: #1a1a1a;
      background: #f9f9f7;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #444;
    }

    textarea {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-family: sans-serif;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      box-sizing: border-box;
      resize: vertical;
      line-height: 1.6;
      color: #1a1a1a;
    }

    textarea:focus {
      outline: none;
      border-color: #999;
    }

    .key-row {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      align-items: center;
    }

    .key-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 13px;
      font-family: monospace;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
    }

    .key-row input:focus {
      outline: none;
      border-color: #999;
    }

    .key-note {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }

    .key-note a {
      color: #555;
    }

    button {
      background: #1a1a1a;
      color: #fff;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      min-height: 20px;
      text-align: center;
    }

    #results {
      margin-top: 24px;
    }

    .result-card {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .result-number {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .result-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .result-reason {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    .error {
      background: #fff3f3;
      border: 1px solid #fcc;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #c00;
    }

    .rating-row {
      margin: 12px 0;
    }

    .rating-row select {
      padding: 10px 12px;
      font-size: 14px;
      font-family: sans-serif;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
    }

    .rating-row select:focus {
      outline: none;
      border-color: #999;
    }

    .date-row {
      margin: 12px 0;
    }

    .date-row input[type="date"] {
      padding: 10px 12px;
      font-size: 14px;
      font-family: sans-serif;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
    }

    .date-row input[type="date"]:focus {
      outline: none;
      border-color: #999;
    }

    /* ── Log section ── */
    .log-section {
      margin-top: 48px;
      border-top: 1px solid #e8e8e4;
      padding-top: 24px;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .log-header h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .log-actions {
      display: flex;
      gap: 8px;
    }

    .log-actions button {
      width: auto;
      padding: 7px 14px;
      font-size: 12px;
      border-radius: 6px;
    }

    .log-actions .btn-export {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #ddd;
    }

    .log-actions .btn-export:hover {
      background: #f0f0ee;
    }

    .log-actions .btn-add {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #1a1a1a;
    }

    .log-actions .btn-add:hover {
      background: #333;
    }

    .log-actions .btn-clear {
      background: #fff;
      color: #c00;
      border: 1px solid #fcc;
    }

    .log-actions .btn-clear:hover {
      background: #fff3f3;
    }

    .manual-form {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .manual-form label {
      margin-top: 10px;
    }

    .manual-form label:first-child {
      margin-top: 0;
    }

    .manual-form textarea {
      margin-bottom: 0;
    }

    .manual-form-row {
      display: flex;
      gap: 12px;
      margin: 10px 0;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .manual-form-row > div {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .manual-form-row input[type="date"],
    .manual-form-row select {
      padding: 8px 10px;
      font-size: 13px;
      font-family: sans-serif;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
    }

    .manual-form-row input[type="date"]:focus,
    .manual-form-row select:focus {
      outline: none;
      border-color: #999;
    }

    .manual-form-btns {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .manual-form-btns button {
      width: auto;
      padding: 9px 18px;
      font-size: 13px;
    }

    .btn-form-cancel {
      background: #fff;
      color: #444;
      border: 1px solid #ddd;
    }

    .btn-form-cancel:hover {
      background: #f0f0ee;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ccc;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      width: auto;
      text-decoration: underline;
      font-weight: 400;
      margin-top: 4px;
      text-align: right;
    }

    .btn-remove:hover {
      color: #c00;
      background: none;
    }

    .log-empty {
      font-size: 13px;
      color: #aaa;
      text-align: center;
      padding: 24px 0;
    }

    .log-entry {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .log-entry-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }

    .log-entry-dates {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-entry-logged {
      font-size: 11px;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .log-entry-record {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-edit-date {
      background: none;
      border: none;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      width: auto;
      text-decoration: underline;
      font-weight: 400;
    }

    .btn-edit-date:hover {
      color: #555;
      background: none;
    }

    .record-date-edit {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .record-date-edit input[type="date"] {
      padding: 3px 7px;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
    }

    .record-date-edit input[type="date"]:focus {
      outline: none;
      border-color: #999;
    }

    .btn-save-date, .btn-cancel-date {
      background: none;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      width: auto;
      color: #444;
      font-weight: 500;
    }

    .btn-save-date {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .btn-save-date:hover { background: #333; }
    .btn-cancel-date:hover { background: #f0f0ee; }

    .log-entry-rating {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      background: #f0f0ee;
      border-radius: 5px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .log-history {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      border-left: 2px solid #e8e8e4;
      padding-left: 10px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .log-type-group {
      margin-bottom: 10px;
    }

    .log-type-label {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .log-item {
      font-size: 13px;
      color: #1a1a1a;
      padding: 3px 0;
      border-bottom: 1px solid #f3f3f1;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-item-title {
      font-weight: 600;
    }

    .log-item-reason {
      color: #777;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h1>jdlogs</h1>
  <p class="subtitle">Tell the agent what you've enjoyed — it'll find your next favourite.</p>

  <label for="history">Your recent watches, reads, or listens</label>
  <textarea id="history" rows="6"
    placeholder="e.g.
- Watched Inception and loved it
- Read Dune, really enjoyed the world-building
- Listened to a lot of Radiohead lately
- Watched The Bear on Hulu, loved the pacing
- Played The Last of Us, loved the story"></textarea>

  <div class="date-row">
    <label for="record-date">Date of record</label>
    <input type="date" id="record-date" />
  </div>

  <div class="rating-row">
    <label for="rating">How much did you enjoy these overall?</label>
    <select id="rating">
      <option value="1">1 — Didn't really enjoy it</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5" selected>5 — It was okay</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10 — Absolutely loved it</option>
    </select>
  </div>

  <div class="key-row">
    <input type="password" id="api-key" placeholder="Paste your Anthropic API key here (sk-ant-...)" />
  </div>
  <p class="key-note">Get a free key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys. It stays in your browser only.</p>

  <button id="go-btn" onclick="getRecommendations()">Get recommendations</button>

  <p id="status"></p>
  <div id="results"></div>

  <div class="log-section">
    <div class="log-header">
      <h2>Media Log</h2>
      <div class="log-actions">
        <button class="btn-add" onclick="toggleAddForm()">+ Add</button>
        <button class="btn-export" onclick="exportCSV()">Export CSV</button>
        <button class="btn-clear" onclick="clearLog()">Clear log</button>
      </div>
    </div>

    <div class="manual-form" id="manual-form" style="display:none;">
      <label for="manual-history">What did you watch, read, or listen to?</label>
      <textarea id="manual-history" rows="4" placeholder="e.g.&#10;- Watched Parasite&#10;- Read The Road&#10;- Played Hollow Knight"></textarea>
      <div class="manual-form-row">
        <div>
          <label for="manual-date">Date of record</label>
          <input type="date" id="manual-date" />
        </div>
        <div>
          <label for="manual-rating">Enjoyment</label>
          <select id="manual-rating">
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5" selected>5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option>
            <option value="9">9</option><option value="10">10</option>
          </select>
        </div>
      </div>
      <div class="manual-form-btns">
        <button onclick="addManualEntry()">Save entry</button>
        <button class="btn-form-cancel" onclick="toggleAddForm()">Cancel</button>
      </div>
    </div>

    <div id="log"></div>
  </div>

  <script>
    const LOG_KEY = "jdrecs_log";

    const TYPE_PLURALS = {
      "Movie": "Movies", "TV Show": "TV Shows", "Book": "Books",
      "Album": "Albums", "Podcast": "Podcasts", "Video Game": "Video Games"
    };
    const TYPE_ORDER = ["Movie", "TV Show", "Book", "Album", "Podcast", "Video Game"];

    // Set date input to today on load
    document.getElementById("record-date").value = new Date().toISOString().slice(0, 10);

    function loadLog() {
      try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; }
      catch { return []; }
    }

    function saveToLog(history, recordDate, rating, recs) {
      const entries = loadLog();
      entries.unshift({
        date: new Date().toISOString(),
        recordDate,
        rating,
        history,
        recommendations: recs
      });
      localStorage.setItem(LOG_KEY, JSON.stringify(entries));
      renderLog();
    }

    function updateEntryRecordDate(index, newDate) {
      const entries = loadLog();
      if (entries[index]) {
        entries[index].recordDate = newDate;
        localStorage.setItem(LOG_KEY, JSON.stringify(entries));
      }
      renderLog();
    }

    function formatDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }

    function renderLog() {
      const entries = loadLog();
      const container = document.getElementById("log");

      if (entries.length === 0) {
        container.innerHTML = '<p class="log-empty">No entries yet — get some recommendations to start your log.</p>';
        return;
      }

      container.innerHTML = entries.map((entry, index) => {
        const loggedDate = new Date(entry.date).toLocaleDateString("en-US", {
          year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        });
        const recordDisplay = entry.recordDate
          ? formatDate(entry.recordDate + "T12:00:00")
          : "Not set";

        const grouped = {};
        for (const r of (entry.recommendations || [])) {
          if (!grouped[r.type]) grouped[r.type] = [];
          grouped[r.type].push(r);
        }

        const sortedTypes = Object.keys(grouped).sort(
          (a, b) => TYPE_ORDER.indexOf(a) - TYPE_ORDER.indexOf(b)
        );

        const groupsHTML = sortedTypes.length === 0 ? "" : sortedTypes.map(type => `
          <div class="log-type-group">
            <div class="log-type-label">${TYPE_PLURALS[type] || type + "s"}</div>
            ${grouped[type].map(r => `
              <div class="log-item">
                <span class="log-item-title">${r.title}</span>
                <span class="log-item-reason"> — ${r.reason}</span>
              </div>
            `).join("")}
          </div>
        `).join("");

        return `
          <div class="log-entry" id="entry-${index}">
            <div class="log-entry-meta">
              <div class="log-entry-dates">
                <span class="log-entry-logged">Logged: ${loggedDate}</span>
                <span class="log-entry-record" id="record-display-${index}">
                  Record date: ${recordDisplay}
                  <button class="btn-edit-date" onclick="startEditDate(${index}, '${entry.recordDate || ''}')">Edit</button>
                </span>
                <span class="record-date-edit" id="record-edit-${index}" style="display:none;">
                  <input type="date" id="record-input-${index}" value="${entry.recordDate || new Date().toISOString().slice(0,10)}" />
                  <button class="btn-save-date" onclick="saveEditDate(${index})">Save</button>
                  <button class="btn-cancel-date" onclick="cancelEditDate(${index})">Cancel</button>
                </span>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;">
                <span class="log-entry-rating">Enjoyed: ${entry.rating}/10</span>
                <button class="btn-remove" onclick="removeEntry(${index})">Remove</button>
              </div>
            </div>
            <div class="log-history">${entry.history}</div>
            ${groupsHTML}
          </div>
        `;
      }).join("");
    }

    function startEditDate(index, currentDate) {
      document.getElementById(`record-display-${index}`).style.display = "none";
      const editRow = document.getElementById(`record-edit-${index}`);
      editRow.style.display = "flex";
      if (currentDate) document.getElementById(`record-input-${index}`).value = currentDate;
    }

    function saveEditDate(index) {
      const val = document.getElementById(`record-input-${index}`).value;
      updateEntryRecordDate(index, val);
    }

    function cancelEditDate(index) {
      document.getElementById(`record-display-${index}`).style.display = "flex";
      document.getElementById(`record-edit-${index}`).style.display = "none";
    }

    function toggleAddForm() {
      const form = document.getElementById("manual-form");
      const visible = form.style.display !== "none";
      form.style.display = visible ? "none" : "block";
      if (!visible) {
        document.getElementById("manual-date").value = new Date().toISOString().slice(0, 10);
        document.getElementById("manual-history").value = "";
        document.getElementById("manual-rating").value = "5";
      }
    }

    function addManualEntry() {
      const history = document.getElementById("manual-history").value.trim();
      if (!history) { alert("Please describe some media first."); return; }
      const recordDate = document.getElementById("manual-date").value;
      const rating = document.getElementById("manual-rating").value;
      const entries = loadLog();
      entries.unshift({
        date: new Date().toISOString(),
        recordDate,
        rating,
        history,
        recommendations: [],
        manual: true
      });
      localStorage.setItem(LOG_KEY, JSON.stringify(entries));
      toggleAddForm();
      renderLog();
    }

    function removeEntry(index) {
      if (!confirm("Remove this log entry?")) return;
      const entries = loadLog();
      entries.splice(index, 1);
      localStorage.setItem(LOG_KEY, JSON.stringify(entries));
      renderLog();
    }

    function exportCSV() {
      const entries = loadLog();
      if (entries.length === 0) { alert("No log entries to export."); return; }

      const rows = [["Logged Date", "Record Date", "Rating", "Type", "Title", "Reason", "History"]];
      for (const entry of entries) {
        const logged = new Date(entry.date).toLocaleString();
        const record = entry.recordDate || "";
        for (const r of entry.recommendations) {
          rows.push([logged, record, entry.rating, r.type, r.title, r.reason, entry.history.replace(/\n/g, " ")]);
        }
      }

      const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "jdlogs.csv";
      a.click();
    }

    function clearLog() {
      if (!confirm("Clear your entire media log? This cannot be undone.")) return;
      localStorage.removeItem(LOG_KEY);
      renderLog();
    }

    async function getRecommendations() {
      const history = document.getElementById("history").value.trim();
      const recordDate = document.getElementById("record-date").value;
      const rating = document.getElementById("rating").value;
      const apiKey = document.getElementById("api-key").value.trim();
      const btn = document.getElementById("go-btn");
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      if (!history) {
        status.textContent = "Please describe some things you've watched, read, or listened to.";
        return;
      }

      if (!apiKey || !apiKey.startsWith("sk-")) {
        status.textContent = "Please paste your API key above (starts with sk-ant-...).";
        return;
      }

      btn.disabled = true;
      status.textContent = "Thinking...";
      results.innerHTML = "";

      const prompt = `You are a personalized media recommendation agent.

The user has shared their recent viewing, reading, and listening history:

${history}

The user rated their overall enjoyment of this content: ${rating}/10.

Based on this, recommend exactly 5 things they haven't seen/read/heard yet.
Mix media types if it fits (movies, shows, books, albums, podcasts, video games).

Return ONLY a JSON array with exactly 5 objects. No extra text, no markdown, just raw JSON.
Each object must have:
- "title": the name of the work
- "type": one of "Movie", "TV Show", "Book", "Album", "Podcast", or "Video Game"
- "reason": one sentence explaining why they'd love it based on their history

Example format:
[{"title":"...","type":"Movie","reason":"..."},...]`;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 1000,
            messages: [{ role: "user", content: prompt }]
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || "API error " + response.status);
        }

        const data = await response.json();
        const text = data.content[0].text.trim();

        let recs;
        try {
          const clean = text.replace(/```json|```/g, "").trim();
          recs = JSON.parse(clean);
        } catch {
          throw new Error("Couldn't parse the response. Try again.");
        }

        status.textContent = "";
        results.innerHTML = recs.map((r, i) => `
          <div class="result-card">
            <div class="result-number">#${i + 1} &mdash; ${r.type}</div>
            <div class="result-title">${r.title}</div>
            <div class="result-reason">${r.reason}</div>
          </div>
        `).join("");

        saveToLog(history, recordDate, rating, recs);

      } catch (err) {
        status.textContent = "";
        results.innerHTML = `<div class="error">Something went wrong: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    renderLog();
  </script>

</body>
</html>
