<!DOCTYPE html>
<html>
<head>
  <title>My Media Agent</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 620px;
      margin: 48px auto;
      padding: 0 24px;
      color: #1a1a1a;
      background: #f9f9f7;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #444;
    }

    textarea {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-family: sans-serif;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      box-sizing: border-box;
      resize: vertical;
      line-height: 1.6;
      color: #1a1a1a;
    }

    textarea:focus {
      outline: none;
      border-color: #999;
    }

    .key-row {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      align-items: center;
    }

    .key-row input {
      flex: 1;
      padding: 10px 12px;
      font-size: 13px;
      font-family: monospace;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
    }

    .key-row input:focus {
      outline: none;
      border-color: #999;
    }

    .key-note {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }

    .key-note a {
      color: #555;
    }

    button {
      background: #1a1a1a;
      color: #fff;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      min-height: 20px;
      text-align: center;
    }

    #results {
      margin-top: 24px;
    }

    .result-card {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .result-number {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .result-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .result-reason {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    .error {
      background: #fff3f3;
      border: 1px solid #fcc;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #c00;
    }

    .rating-row {
      margin: 12px 0;
    }

    .rating-row select {
      padding: 10px 12px;
      font-size: 14px;
      font-family: sans-serif;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
    }

    .rating-row select:focus {
      outline: none;
      border-color: #999;
    }

    /* ── Log section ── */
    .log-section {
      margin-top: 48px;
      border-top: 1px solid #e8e8e4;
      padding-top: 24px;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .log-header h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .log-actions {
      display: flex;
      gap: 8px;
    }

    .log-actions button {
      width: auto;
      padding: 7px 14px;
      font-size: 12px;
      border-radius: 6px;
    }

    .log-actions .btn-export {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #ddd;
    }

    .log-actions .btn-export:hover {
      background: #f0f0ee;
    }

    .log-actions .btn-clear {
      background: #fff;
      color: #c00;
      border: 1px solid #fcc;
    }

    .log-actions .btn-clear:hover {
      background: #fff3f3;
    }

    .log-empty {
      font-size: 13px;
      color: #aaa;
      text-align: center;
      padding: 24px 0;
    }

    .log-entry {
      background: #fff;
      border: 1px solid #e8e8e4;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .log-entry-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .log-entry-date {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .log-entry-rating {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      background: #f0f0ee;
      border-radius: 5px;
      padding: 2px 8px;
    }

    .log-history {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      border-left: 2px solid #e8e8e4;
      padding-left: 10px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .log-type-group {
      margin-bottom: 10px;
    }

    .log-type-label {
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .log-item {
      font-size: 13px;
      color: #1a1a1a;
      padding: 3px 0;
      border-bottom: 1px solid #f3f3f1;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-item-title {
      font-weight: 600;
    }

    .log-item-reason {
      color: #777;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h1>What should I watch next?</h1>
  <p class="subtitle">Tell the agent what you've enjoyed — it'll find your next favourite.</p>

  <label for="history">Your recent watches, reads, or listens</label>
  <textarea id="history" rows="6"
    placeholder="e.g.
- Watched Inception and loved it
- Read Dune, really enjoyed the world-building
- Listened to a lot of Radiohead lately
- Watched The Bear on Hulu, loved the pacing
- Played The Last of Us, loved the story"></textarea>

  <div class="rating-row">
    <label for="rating">How much did you enjoy these overall?</label>
    <select id="rating">
      <option value="1">1 — Didn't really enjoy it</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5" selected>5 — It was okay</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10 — Absolutely loved it</option>
    </select>
  </div>

  <div class="key-row">
    <input type="password" id="api-key" placeholder="Paste your Anthropic API key here (sk-ant-...)" />
  </div>
  <p class="key-note">Get a free key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys. It stays in your browser only.</p>

  <button id="go-btn" onclick="getRecommendations()">Get recommendations</button>

  <p id="status"></p>
  <div id="results"></div>

  <div class="log-section">
    <div class="log-header">
      <h2>Media Log</h2>
      <div class="log-actions">
        <button class="btn-export" onclick="exportCSV()">Export CSV</button>
        <button class="btn-clear" onclick="clearLog()">Clear log</button>
      </div>
    </div>
    <div id="log"></div>
  </div>

  <script>
    const LOG_KEY = "jdrecs_log";

    function loadLog() {
      try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; }
      catch { return []; }
    }

    function saveToLog(history, rating, recs) {
      const entries = loadLog();
      entries.unshift({ date: new Date().toISOString(), rating, history, recommendations: recs });
      localStorage.setItem(LOG_KEY, JSON.stringify(entries));
      renderLog();
    }

    function renderLog() {
      const entries = loadLog();
      const container = document.getElementById("log");

      if (entries.length === 0) {
        container.innerHTML = '<p class="log-empty">No entries yet — get some recommendations to start your log.</p>';
        return;
      }

      container.innerHTML = entries.map(entry => {
        const date = new Date(entry.date).toLocaleDateString("en-US", {
          year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        });

        const grouped = {};
        for (const r of entry.recommendations) {
          if (!grouped[r.type]) grouped[r.type] = [];
          grouped[r.type].push(r);
        }

        const typeOrder = ["Movie", "TV Show", "Book", "Album", "Podcast", "Video Game"];
        const sortedTypes = Object.keys(grouped).sort(
          (a, b) => typeOrder.indexOf(a) - typeOrder.indexOf(b)
        );

        const groupsHTML = sortedTypes.map(type => `
          <div class="log-type-group">
            <div class="log-type-label">${type}s</div>
            ${grouped[type].map(r => `
              <div class="log-item">
                <span class="log-item-title">${r.title}</span>
                <span class="log-item-reason"> — ${r.reason}</span>
              </div>
            `).join("")}
          </div>
        `).join("");

        return `
          <div class="log-entry">
            <div class="log-entry-meta">
              <span class="log-entry-date">${date}</span>
              <span class="log-entry-rating">Enjoyed: ${entry.rating}/10</span>
            </div>
            <div class="log-history">${entry.history}</div>
            ${groupsHTML}
          </div>
        `;
      }).join("");
    }

    function exportCSV() {
      const entries = loadLog();
      if (entries.length === 0) { alert("No log entries to export."); return; }

      const rows = [["Date", "Rating", "Type", "Title", "Reason", "History"]];
      for (const entry of entries) {
        const date = new Date(entry.date).toLocaleString();
        for (const r of entry.recommendations) {
          rows.push([date, entry.rating, r.type, r.title, r.reason, entry.history.replace(/\n/g, " ")]);
        }
      }

      const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "jdrecs-log.csv";
      a.click();
    }

    function clearLog() {
      if (!confirm("Clear your entire media log? This cannot be undone.")) return;
      localStorage.removeItem(LOG_KEY);
      renderLog();
    }

    async function getRecommendations() {
      const history = document.getElementById("history").value.trim();
      const rating = document.getElementById("rating").value;
      const apiKey = document.getElementById("api-key").value.trim();
      const btn = document.getElementById("go-btn");
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      if (!history) {
        status.textContent = "Please describe some things you've watched, read, or listened to.";
        return;
      }

      if (!apiKey || !apiKey.startsWith("sk-")) {
        status.textContent = "Please paste your API key above (starts with sk-ant-...).";
        return;
      }

      btn.disabled = true;
      status.textContent = "Thinking...";
      results.innerHTML = "";

      const prompt = `You are a personalized media recommendation agent.

The user has shared their recent viewing, reading, and listening history:

${history}

The user rated their overall enjoyment of this content: ${rating}/10.

Based on this, recommend exactly 5 things they haven't seen/read/heard yet.
Mix media types if it fits (movies, shows, books, albums, podcasts, video games).

Return ONLY a JSON array with exactly 5 objects. No extra text, no markdown, just raw JSON.
Each object must have:
- "title": the name of the work
- "type": one of "Movie", "TV Show", "Book", "Album", "Podcast", or "Video Game"
- "reason": one sentence explaining why they'd love it based on their history

Example format:
[{"title":"...","type":"Movie","reason":"..."},...]`;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 1000,
            messages: [{ role: "user", content: prompt }]
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || "API error " + response.status);
        }

        const data = await response.json();
        const text = data.content[0].text.trim();

        let recs;
        try {
          const clean = text.replace(/```json|```/g, "").trim();
          recs = JSON.parse(clean);
        } catch {
          throw new Error("Couldn't parse the response. Try again.");
        }

        status.textContent = "";
        results.innerHTML = recs.map((r, i) => `
          <div class="result-card">
            <div class="result-number">#${i + 1} &mdash; ${r.type}</div>
            <div class="result-title">${r.title}</div>
            <div class="result-reason">${r.reason}</div>
          </div>
        `).join("");

        saveToLog(history, rating, recs);

      } catch (err) {
        status.textContent = "";
        results.innerHTML = `<div class="error">Something went wrong: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    renderLog();
  </script>

</body>
</html>
